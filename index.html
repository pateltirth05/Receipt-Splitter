<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipt Splitter</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
         <h2 id="headings">Receipt Splitter</h2><br>
      <div class="row justify-content-md-evenly overview">
      
        <div class="col-12 col-md-6">
          <div class="mb-3">
            <label class="form-label">Bill Amount</label>
            <div class="input-group">
              <span class="input-group-text">₹</span>
              <input
                type="number"
                class="form-control"
                id="bill"
                placeholder="e.g. 500"
              />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Tip (%)</label>
            <div class="input-group">
              <input
                type="number"
                class="form-control"
                id="tip"
                placeholder="e.g. 10"
              />
              <span class="input-group-text">%</span>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Number of People</label>
            <div class="input-group">
              <input
                type="number"
                class="form-control"
                id="person"
                placeholder="e.g. 4"
              />
              <span class="input-group-text">Persons</span>
            </div>
          </div>
        </div>
      
        <div class="col-12 col-md-5">
          <div class="cardd">
            <div class="text-center mb-4">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="80"
                height="80"
                fill="currentColor"
                class="bi bi-receipt"
                viewBox="0 0 16 16"
              >
                <path
                  d="M1.92.506a.5.5 0 0 1 .434.14L3 1.293l.646-.647a.5.5 0 0 1 .708 0L5 1.293l.646-.647a.5.5 0 0 1 .708 0L7 1.293l.646-.647a.5.5 0 0 1 .708 0L9 1.293l.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .801.13l.5 1A.5.5 0 0 1 15 2v12a.5.5 0 0 1-.053.224l-.5 1a.5.5 0 0 1-.8.13L13 14.707l-.646.647a.5.5 0 0 1-.708 0L11 14.707l-.646.647a.5.5 0 0 1-.708 0L9 14.707l-.646.647a.5.5 0 0 1-.708 0L7 14.707l-.646.647a.5.5 0 0 1-.708 0L5 14.707l-.646.647a.5.5 0 0 1-.708 0L3 14.707l-.646.647a.5.5 0 0 1-.801-.13l-.5-1A.5.5 0 0 1 1 14V2a.5.5 0 0 1 .053-.224l.5-1a.5.5 0 0 1 .367-.27m.217 1.338L2 2.118v11.764l.137.274.51-.51a.5.5 0 0 1 .707 0l.646.647.646-.646a.5.5 0 0 1 .708 0l.646.646.646-.646a.5.5 0 0 1 .708 0l.646.646.646-.646a.5.5 0 0 1 .708 0l.646.646.646-.646a.5.5 0 0 1 .708 0l.646.646.646-.646a.5.5 0 0 1 .708 0l.509.509.137-.274V2.118l-.137-.274-.51.51a.5.5 0 0 1-.707 0L12 1.707l-.646.647a.5.5 0 0 1-.708 0L10 1.707l-.646.647a.5.5 0 0 1-.708 0L8 1.707l-.646.647a.5.5 0 0 1-.708 0L6 1.707l-.646.647a.5.5 0 0 1-.708 0L4 1.707l-.646.647a.5.5 0 0 1-.708 0z"
                />
                <path
                  d="M3 4.5a.5.5 0 0 1 .5-.5h6a.5.5 0 1 1 0 1h-6a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h6a.5.5 0 1 1 0 1h-6a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h6a.5.5 0 1 1 0 1h-6a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5m8-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5"
                />
              </svg>
            </div>
            <div class="item">
              <span>Tip Amount</span> <span id="tips">₹0</span>
            </div>
            <div class="item">
              <span>Total</span> <span id="total">₹0</span>
            </div>
            <div class="item">
              <span>Each Person</span> <span id="personbill">₹0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      const bill = document.getElementById("bill");
      const person = document.getElementById("person");
      const tip = document.getElementById("tip");

      bill.addEventListener("input", calculate);
      person.addEventListener("input", calculate);
      tip.addEventListener("input", calculate);

      function calculate() {
        const billValue = Number(bill.value);
        const personValue = Number(person.value);
        const tipValue = Number(tip.value);

        if (!billValue || !personValue) return;

        const tipAmount = billValue * (tipValue / 100);
        const total = billValue + tipAmount;
        const perPerson = total / personValue;

        document.getElementById("tips").textContent =
          "₹" + tipAmount.toFixed(2);
        document.getElementById("total").textContent = "₹" + total.toFixed(2);
        document.getElementById("personbill").textContent =
          "₹" + perPerson.toFixed(2);
      }
    </script>
  </body>
</html>
