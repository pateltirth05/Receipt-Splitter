<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipt Splitter</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5 px-4">
      <div class="row pt-5 justify-content-md-center">
        <div class="col-6 bg-light">
            <form onsubmit="handlesubmit">
          <div class="mb-3">
            <label for="basic-url" class="form-label">Bill</label>
            <div class="input-group">
              <span class="input-group-text" id="basic-addon3">&#8377;</span>
              <input
                type="number"
                class="form-control"
                id="bill"
                aria-describedby="basic-addon3 basic-addon4"
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="basic-url" class="form-label">Enter Tip</label>
            <div class="input-group">
              <input
                type="number"
                class="form-control"
                id="tip"
                aria-describedby="basic-addon3 basic-addon4"
              />
              <span class="input-group-text" id="basic-addon3">%</span>
            </div>
          </div>

          <div class="mb-3">
            <label for="basic-url" class="form-label">Number of People</label>
            <div class="input-group">
              <input
                type="number"
                class="form-control"
                id="person"
                aria-describedby="basic-addon3 basic-addon4"
              
              />
              <span class="input-group-text" id="basic-addon3">Persons</span>
            </div>
          </div>
          <div class="d-grid">
            <button class="btn btn-warning" onclick="calculate">Button</button>
          </div>
            </form>
        </div>
        
        <div class="col-5 bg-light">
          <div class="card">
            <div class="item">
              <span>Tip Amount</span>
              <span id="tips"></span>
            </div>

            <div class="item">
              <span>Total</span>
              <span id="total"></span>
            </div>

            <div class="item">
              <span>Each Person Bill</span>
              <span id="personbill"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
        const bill=document.getElementById('bill')
        const person=document.getElementById('person')
        const tip=document.getElementById('tip')

        bill.addEventListener('input',calculate)
        person.addEventListener('input',calculate)
        tip.addEventListener('input',calculate)

        function calculate(){
            const billValue=Number(bill.value)
             const personValue=Number(person.value)
              const tipValue=Number(tip.value)

              if (!billValue || !personValue) return;

              const tipAmount=billValue*(tipValue/100)
                const total = billValue + tipAmount;
                const perPerson = total / personValue;

                  document.getElementById("tips").textContent = "₹" + tipAmount.toFixed(2);
  document.getElementById("total").textContent = "₹" + total.toFixed(2);
  document.getElementById("personbill").textContent = "₹" + perPerson.toFixed(2);
        }
    </script>
  </body>
</html>
